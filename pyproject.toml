[project]
name = "backend"
version = "0.1.0"
description = "LeadFlow private API with PostgreSQL persistence"
readme = "README.md"
authors = [
    { name = "Arkapravo-Ghosh", email = "arkapravoghosh99@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend.cli:main"
leadflow-create-user = "backend.auth.provision:main"
leadflow-seed = "backend.seed:main"
leadflow-openapi = "backend.export_openapi:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
